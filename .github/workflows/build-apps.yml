name: Build applicazioni Tauri

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      signed_ios:
        description: 'Genera anche IPA firmato (richiede i secret Apple)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS-Apple-Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS-Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Dipendenze Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
        env:
          # Firma ad hoc: eseguibile macOS utilizzabile, senza notarizzazione Apple obbligatoria.
          APPLE_SIGNING_IDENTITY: '-'
      - uses: actions/upload-artifact@v4
        with:
          name: Referto-Volley-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  android:
    name: Android · APK e AAB
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - name: SDK e NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run tauri -- android init --ci --skip-targets-install
      - name: Configura firma release opzionale
        run: python3 scripts/android-signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: APK debug installabile senza firma obbligatoria
        run: npm run android:build -- --debug --apk --target aarch64 armv7 x86_64 --ci -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Referto-Volley-Android-debug-APK
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
      - name: APK e AAB release (se firmati o generati)
        continue-on-error: true
        run: npm run android:build -- --apk --aab --target aarch64 armv7 x86_64 --ci -- --locked
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Referto-Volley-Android-release
          if-no-files-found: warn
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
      - name: Rimuovi chiave temporanea
        if: always()
        run: rm -f src-tauri/gen/android/release.jks

  ios:
    name: iPhone e iPad · ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulatore
            target: aarch64-sim
            rust-target: aarch64-apple-ios-sim
          - name: dispositivo-non-firmato
            target: aarch64
            rust-target: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}
      - run: npm ci
      - run: npm run tauri -- ios init --ci --skip-targets-install
      - name: Build iOS/iPadOS senza credenziali Apple
        run: npm run ios:build -- --target ${{ matrix.target }} --no-sign --ci -- --locked
      - name: Pacchetto IPA unsigned per sideloading (AltStore, Sideloadly, TrollStore)
        if: matrix.target == 'aarch64'
        run: |
          mkdir -p Payload
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
            zip -r Referto-Volley-iOS-unsigned.ipa Payload
            rm -rf Payload
          fi
      - name: Comprimi output Xcode preservando permessi e collegamenti
        run: |
          test -d src-tauri/gen/apple/build
          tar -czf Referto-Volley-iOS-${{ matrix.name }}.tar.gz -C src-tauri/gen/apple build
      - uses: actions/upload-artifact@v4
        with:
          name: Referto-Volley-iOS-${{ matrix.name }}
          if-no-files-found: error
          path: |
            Referto-Volley-iOS-*.tar.gz
            Referto-Volley-iOS-*.ipa

  ios-signed:
    name: iPhone e iPad · IPA firmato
    if: github.event_name == 'workflow_dispatch' && inputs.signed_ios
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-signed
      - name: Prepara credenziali Apple
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_DEVELOPMENT_TEAM"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_PRIVATE_KEY"
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'AuthKey.p8'
          key.write_text(os.environ['APPLE_API_PRIVATE_KEY'])
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'APPLE_API_KEY_PATH={key}\n')
          PY
      - run: npm ci
      - run: npm run tauri -- ios init --ci --skip-targets-install
      - run: npm run ios:build -- --target aarch64 --export-method app-store-connect --build-number ${{ github.run_number }} --ci -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Referto-Volley-iOS-IPA-firmato
          if-no-files-found: error
          path: src-tauri/gen/apple/build/**/*.ipa
      - name: Rimuovi chiave temporanea
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    name: Release automatica su GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica tutti gli artefatti compilati
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Referto-Volley-*
          merge-multiple: true

      - name: Raccogli file per la release
        run: |
          mkdir -p release-files
          find release-assets/ -type f \( \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.apk" -o \
            -name "*.aab" -o \
            -name "*.ipa" -o \
            -name "*.tar.gz" \
          \) -exec cp {} release-files/ \;
          echo "File pronti per la release GitHub:"
          ls -lah release-files/

      - name: Pubblica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
