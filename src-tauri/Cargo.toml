[package]
name = "referto-volley"
version = "0.39.0"
description = "Analisi locale dei referti di gara della pallavolo"
authors = ["Maurizio Napolitano"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/napo/analisirefertogara"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
# Needed by the generated context when tauri.conf.json configures plugins
serde_json = "1"
# Opens download links in the system browser (update notice on Android / iOS)
tauri-plugin-opener = "~2.7.3"
# "Save as" dialog for the PDF report and the archive, so the user knows where the file goes
# (exact versions, in step with tauri)
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
# Requests to the cloud service of the synchronisation. unsafe-headers: Microsoft refuses the Origin header of
# the web view outside single-page apps, so the token requests go without it
tauri-plugin-http = { version = "=2.9.0", features = ["unsafe-headers"] }
# Google sign-in on Android (Play services); it does nothing elsewhere
tauri-plugin-google-auth = { path = "plugins/google-auth" }

# Automatic updates with user confirmation: desktop only (the Tauri updater does not support mobile)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "~2.14.1"
tauri-plugin-process = "~2.4.0"
