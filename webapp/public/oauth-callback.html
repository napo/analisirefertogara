<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Referto Volley</title>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 3em">
    <h1>Referto Volley</h1>
    <p>Accesso completato: puoi chiudere questa pagina e tornare all’app.</p>
    <script>
      // Hands the address, with the code of the sign-in, to the app that opened this window (src/sync/auth-popup.js)
      const channel = new BroadcastChannel('referto-volley-oauth')
      channel.postMessage(location.href)
      channel.close()
      history.replaceState(null, '', location.pathname)
      window.close()
    </script>
  </body>
</html>
